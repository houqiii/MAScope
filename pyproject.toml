[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mascope"
version = "1.2.0"
description = "A benchmark environment for multi-agent collaboration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
mascope = "mascope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mascope = ["release.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
